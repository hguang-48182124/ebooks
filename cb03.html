<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>阿難問事佛吉凶經科會 · 線上電子書</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap');
  :root{
    --paper: #EDE7D6; --paper-deep: #E2DAC3; --ink: #2B2A25; --ink-soft: #5C5A4E;
    --pine: #33473F; --pine-deep: #22322C; --brick: #A85338; --gold: #B8925A;
    --line: rgba(43,42,37,0.12);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background: var(--paper); font-family: 'Noto Sans TC', sans-serif; color: var(--ink); overflow-x:hidden; }
  body{ background-image: radial-gradient(circle at 15% 10%, rgba(184,146,90,0.10), transparent 40%), radial-gradient(circle at 85% 90%, rgba(51,71,63,0.08), transparent 45%); }
  .wrap{ max-width: 960px; margin: 0 auto; padding: 20px 16px 40px; min-height:100vh; display:flex; flex-direction:column; }
  header{ display:flex; align-items:baseline; justify-content:space-between; padding-bottom:14px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .brand{ font-family:'Noto Serif TC', serif; font-weight:700; font-size: 18px; letter-spacing: 0.04em; color: var(--pine-deep); }
  .brand span{ display:block; font-family:'Noto Sans TC',sans-serif; font-weight:300; font-size:10px; letter-spacing:0.2em; color: var(--ink-soft); margin-top:3px; }
  .title-block{ text-align:center; margin-bottom: 14px; }
  h1{ font-family:'Noto Serif TC', serif; font-weight:700; font-size: clamp(22px, 5.5vw, 34px); color: var(--pine-deep); line-height:1.3; }
  .subtitle{ margin-top:6px; font-size:12px; color: var(--ink-soft); letter-spacing:0.03em; }

  /* ---- fast page navigation bar (replaces volume-nav; jump straight to a page) ---- */
  .jump-bar{ display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .jump-bar input{ width:64px; text-align:center; font-size:14px; padding:7px 6px; border-radius:6px; border:1px solid var(--line); background:#fff; }
  .jump-bar button{ font-size:13px; padding:7px 14px; border-radius:6px; border:1px solid var(--pine); background:transparent; color:var(--pine); cursor:pointer; }
  .jump-bar button:hover{ background: rgba(51,71,63,0.08); }
  .jump-bar .sep{ font-size:12px; color:var(--ink-soft); }

  .book-stage{ position:relative; display:flex; justify-content:center; align-items:center; margin: 0 auto 12px; width:fit-content; max-width:100%; }
  /* .book-frame 內有一或兩個 page-slot。單頁模式=一個 slot 佔滿寬度；
     雙頁模式=左右兩個 slot 並排、中間無縫，讓左右頁在視覺上像攤開的書。
     封面／封底（以及書封奇偶不對齊時補的虛擬空白頁）一律以單頁比例呈現，
     不會被硬塞進雙頁框架裡變形或跟內文配錯對。 */
  .book-frame{ position:relative; display:flex; border-radius: 3px; box-shadow: 0 2px 4px rgba(43,42,37,0.15), 0 18px 40px -12px rgba(34,50,44,0.35), 0 0 0 1px rgba(43,42,37,0.06); background: var(--pine-deep); overflow:hidden; touch-action: pan-y pinch-zoom; -webkit-user-select:none; user-select:none; }
  .book-frame.single{ aspect-ratio: 420.00 / 595.00; }
  .book-frame.dual{ aspect-ratio: 840.00 / 595.00; }
  .page-slot{ position:relative; flex: 1 1 50%; height:100%; overflow:hidden; background: var(--pine-deep); }
  .page-slot.blank{ background: var(--paper); }
  .page-slot img{ width:100%; height:100%; display:block; object-fit: cover; opacity:0; transition: opacity 0.15s ease; }
  .page-slot img.ready{ opacity:1; }
  .book-frame .spinner{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:rgba(237,231,214,0.5); font-size:12px; letter-spacing:0.1em; z-index:2; pointer-events:none; }
  .nav-btn{ position:absolute; top:50%; transform: translateY(-50%); width:42px; height:42px; border-radius:50%; border:none; background: rgba(255,255,255,0.85); color: var(--pine-deep); font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow: 0 4px 14px rgba(43,42,37,0.18); z-index:5; }
  .nav-btn:disabled{ opacity:0.25; cursor:default; }
  .nav-prev{ left: -6px; } .nav-next{ right: -6px; }
  @media (min-width: 640px){ .nav-prev{ left: -54px; } .nav-next{ right: -54px; } }
  .page-indicator{ text-align:center; font-size:12px; color: var(--ink-soft); letter-spacing:0.1em; margin-top:14px; margin-bottom:6px; }
  .page-indicator b{ color: var(--pine-deep); }
  .progress-track{ width: min(84vw, 420px); height:2px; background: var(--line); margin: 0 auto 30px; border-radius:2px; overflow:hidden; }
  .progress-fill{ height:100%; background: var(--brick); transition: width 0.15s ease; }
  .hint{ text-align:center; font-size:11px; color: var(--ink-soft); letter-spacing:0.05em; margin-bottom: 30px; }
  footer{ text-align:center; margin-top: 20px; padding-top:16px; border-top: 1px solid var(--line); font-size:11px; color: var(--ink-soft); letter-spacing:0.05em; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><a href="index.html#cb03" style="color:inherit; text-decoration:none;">← 法寶園地</a><span>ONLINE READING · 電子書自架</span></div>
  </header>
  <div class="title-block">
    <h1>阿難問事佛吉凶經科會</h1>
    <div class="subtitle">淨空法師講述 · 全書 33 頁</div>
  </div>
  <div class="jump-bar">
    <input type="text" inputmode="numeric" pattern="[0-9]*" id="jumpInput" placeholder="頁碼" autocomplete="off">
    <button id="jumpBtn">跳到該頁</button>
    <span class="sep">共 33 頁</span>
  </div>
  <div class="book-stage">
    <button class="nav-btn nav-prev" id="prevBtn" aria-label="上一頁">‹</button>
    <div class="book-frame single" id="bookFrame">
      <div class="spinner" id="spinner">載入中…</div>
      <div class="page-slot" id="slotLeft"><img id="pageImgL" alt=""></div>
      <div class="page-slot" id="slotRight" style="display:none;"><img id="pageImgR" alt=""></div>
    </div>
    <button class="nav-btn nav-next" id="nextBtn" aria-label="下一頁">›</button>
  </div>
  <div class="page-indicator">第 <b id="curPage">1</b> / <span id="totalPage">33</span> 頁</div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="hint">電腦／平板寬螢幕會自動雙頁並排；手機自動維持單頁。點左右箭頭、滑動，或按鍵盤方向鍵翻頁；也可以直接輸入頁碼跳頁</div>
<footer>香光淨宗學會 · 法寶園地電子書 &nbsp;|&nbsp; 本頁面自行架設，取代原付費平台</footer>
</div>
<script>
const TOTAL = 33;
const IMG_DIR = 'cb03-images/';
const HAS_COVER = true;
const HAS_BACKCOVER = true;
// 封面固定檔名 0000.jpg、封底固定檔名 9999.jpg，內頁維持原本 0001.jpg 起算，
// 這樣加補封面/封底時完全不用重新命名內頁。沒有封面/封底時（HAS_COVER 和
// HAS_BACKCOVER 都是 false）跟原本 ac04 的行為完全一樣。
function srcFor(n){
  if(HAS_COVER && n === 1) return IMG_DIR + '0000.jpg';
  if(HAS_BACKCOVER && n === TOTAL) return IMG_DIR + '9999.jpg';
  const contentIndex = HAS_COVER ? n - 1 : n;
  return IMG_DIR + String(contentIndex).padStart(4,'0') + '.jpg';
}

// ---- 雙頁配對表 --------------------------------------------------------
// 規則：第 1 頁（不論是不是真的封面）永遠自己單獨一格，不跟任何頁配對；
// 如果有封底（HAS_BACKCOVER），最後一頁也單獨一格。中間的內頁兩兩一組
// 左右配對；如果內頁張數是奇數，最後補一個「虛擬空白頁」讓左右頁永遠對齊
// （避免後面每一頁的左右配對都因為少一頁而錯位）。
function buildSpreads(){
  const spreads = [{ type:'single', page: 1 }];
  const interiorEnd = TOTAL - (HAS_BACKCOVER ? 1 : 0);
  const interior = [];
  for(let p = 2; p <= interiorEnd; p++) interior.push(p);
  if(interior.length % 2 === 1) interior.push(null); // 虛擬空白頁
  for(let i = 0; i < interior.length; i += 2){
    spreads.push({ type:'pair', left: interior[i], right: interior[i+1] });
  }
  if(HAS_BACKCOVER) spreads.push({ type:'single', page: TOTAL });
  return spreads;
}
const SPREADS = buildSpreads();
function spreadIndexForPage(page){
  for(let i = 0; i < SPREADS.length; i++){
    const s = SPREADS[i];
    if(s.type === 'single' && s.page === page) return i;
    if(s.type === 'pair' && (s.left === page || s.right === page)) return i;
  }
  return 0;
}

let current = 1;    // 目前頁碼（永遠是真實頁碼，不是 spread 索引）
let mode = 'single'; // 'single' | 'dual' —— 完全自動判斷，不提供手動切換
const mq = window.matchMedia('(min-width: 900px)');
// 「電腦版檢視」模式會讓瀏覽器回報寬螢幕，光用 matchMedia(min-width) 判斷
// 會被手機的「電腦版網站」功能騙過去。window.screen.width/height 反映的是
// 實體螢幕大小，不受這個偽裝影響，所以雙頁模式要求「視窗夠寬」和「實體螢幕
// 夠寬」兩個條件同時成立，手機不管開不開電腦版模式都會維持單頁。
function physicalScreenIsWide(){
  const narrowSide = Math.min(window.screen.width, window.screen.height);
  return narrowSide >= 700;
}

const bookFrame = document.getElementById('bookFrame');
const spinner = document.getElementById('spinner');
const slotLeft = document.getElementById('slotLeft');
const slotRight = document.getElementById('slotRight');
const pageImgL = document.getElementById('pageImgL');
const pageImgR = document.getElementById('pageImgR');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const curPageEl = document.getElementById('curPage');
const progressFill = document.getElementById('progressFill');
const jumpInput = document.getElementById('jumpInput');
const jumpBtn = document.getElementById('jumpBtn');

// 從 CSS 用的長寬比字串（例如 "422.40 / 595.20"）解析出純數字比例，
// 這樣 JS 才能用實際螢幕高度反推出「不會太高」的寬度上限。
function parseRatio(str){
  const parts = str.split('/').map(s => parseFloat(s));
  return parts[0] / parts[1];
}
const RATIO_SINGLE = parseRatio('420.00 / 595.00');
const RATIO_DUAL = parseRatio('840.00 / 595.00');

// 書本寬度不再是寫死的 CSS 數字，而是即時用「目前螢幕的寬、高」一起算出來：
// 同時滿足「不超過螢幕寬度的一定比例」和「換算成高度後，不超過螢幕高度的
// 一定比例」，兩者取小的那個。這樣不管哪一本書（長寬比差多少）、哪種裝置
// 螢幕多高，書本底下的頁碼／進度條永遠會留在看得到的範圍內，不用再為
// 每一本書單獨算一個 vh 數字。
const VH_BUDGET = 0.56; // 書本區塊最多佔畫面高度的 56%，留給上方標題列跟下方頁碼/進度條
function fitBookFrame(){
  const isDual = bookFrame.classList.contains('dual');
  const ratio = isDual ? RATIO_DUAL : RATIO_SINGLE;
  const vwFrac = isDual ? 0.92 : 0.84;
  const maxPx = isDual ? 840 : 420;
  const widthFromVW = window.innerWidth * vwFrac;
  const widthFromVH = window.innerHeight * VH_BUDGET * ratio;
  const w = Math.min(widthFromVW, maxPx, widthFromVH);
  bookFrame.style.width = w + 'px';
}

// 預先快取目前位置附近的幾張圖，讓上一頁/下一頁反應更快
const cache = new Map();
function preloadPage(n){
  if(n == null || n < 1 || n > TOTAL || cache.has(n)) return;
  const im = new Image();
  im.src = srcFor(n);
  cache.set(n, im);
}
function loadInto(imgEl, page){
  const slot = imgEl.parentElement;
  if(page == null){
    slot.classList.add('blank');
    imgEl.classList.remove('ready');
    imgEl.removeAttribute('src');
    return;
  }
  slot.classList.remove('blank');
  const target = srcFor(page);
  const cached = cache.get(page);
  const finish = () => { imgEl.src = target; imgEl.classList.add('ready'); };
  if(cached && cached.complete){ finish(); }
  else {
    imgEl.classList.remove('ready');
    const im = new Image();
    im.onload = finish;
    im.src = target;
    cache.set(page, im);
  }
}

function render(){
  progressFill.style.width = ((current - 1) / (TOTAL - 1) * 100) + '%';
  if(mode === 'single'){
    bookFrame.classList.add('single'); bookFrame.classList.remove('dual');
    slotRight.style.display = 'none';
    loadInto(pageImgL, current);
    curPageEl.textContent = current;
    prevBtn.disabled = current <= 1;
    nextBtn.disabled = current >= TOTAL;
    preloadPage(current + 1); preloadPage(current + 2); preloadPage(current - 1);
  } else {
    const idx = spreadIndexForPage(current);
    const s = SPREADS[idx];
    if(s.type === 'single'){
      // 封面/封底這種單獨頁，就算在雙頁模式下也維持單頁比例呈現，
      // 不會被硬塞進雙頁框架裡被 object-fit:cover 裁切變形。
      bookFrame.classList.add('single'); bookFrame.classList.remove('dual');
      slotRight.style.display = 'none';
      loadInto(pageImgL, s.page);
      curPageEl.textContent = s.page;
    } else {
      bookFrame.classList.add('dual'); bookFrame.classList.remove('single');
      slotRight.style.display = '';
      loadInto(pageImgL, s.left);
      loadInto(pageImgR, s.right);
      curPageEl.textContent = s.right ? (s.left + '–' + s.right) : String(s.left);
    }
    prevBtn.disabled = idx <= 0;
    nextBtn.disabled = idx >= SPREADS.length - 1;
    const around = [SPREADS[idx + 1], SPREADS[idx - 1]];
    around.forEach(sp => { if(!sp) return; preloadPage(sp.page); preloadPage(sp.left); preloadPage(sp.right); });
  }
  fitBookFrame(); // 一定要在上面 class 確定是 single 還是 dual 之後才算寬度
}

function goToPage(n){
  current = Math.min(Math.max(n, 1), TOTAL);
  render();
}
function next(){
  if(mode === 'single'){ if(current < TOTAL) goToPage(current + 1); return; }
  const idx = spreadIndexForPage(current);
  if(idx < SPREADS.length - 1){ const s = SPREADS[idx + 1]; goToPage(s.type === 'single' ? s.page : s.left); }
}
function prev(){
  if(mode === 'single'){ if(current > 1) goToPage(current - 1); return; }
  const idx = spreadIndexForPage(current);
  if(idx > 0){ const s = SPREADS[idx - 1]; goToPage(s.type === 'single' ? s.page : s.left); }
}

nextBtn.addEventListener('click', next);
prevBtn.addEventListener('click', prev);
document.addEventListener('keydown', (e) => { if(e.key === 'ArrowRight') next(); if(e.key === 'ArrowLeft') prev(); });
jumpBtn.addEventListener('click', () => {
  const n = parseInt(jumpInput.value, 10);
  if(!isNaN(n)) goToPage(n);
});
jumpInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') jumpBtn.click(); });

// 沒有手動切換鈕：模式完全自動判斷、每次都重新計算，不會有「卡住」的
// 使用者偏好設定。手機（依實體螢幕判斷，不受電腦版模式偽裝影響）永遠
// 強制單頁；真正的桌機/平板永遠雙頁（封面封底仍會在 render() 裡強制單頁呈現）。
function applyCapability(){
  const capable = mq.matches && physicalScreenIsWide();
  mode = capable ? 'dual' : 'single';
  render();
}
if(mq.addEventListener) mq.addEventListener('change', applyCapability);
else mq.addListener(applyCapability);
window.addEventListener('resize', applyCapability);
window.addEventListener('orientationchange', applyCapability);

// swipe：放開手指才判斷一次方向，不逐格拖動一大串 DOM，這樣大本的書也不會頓
let touchStartX = null, touchStartY = null;
bookFrame.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
}, { passive: true });
bookFrame.addEventListener('touchend', (e) => {
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){
    if(dx < 0) next(); else prev();
  }
  touchStartX = null; touchStartY = null;
});

// 放大時允許自由左右上下平移，縮回原尺寸時恢復左右滑動＝翻頁
function updateZoomState(){
  if(!window.visualViewport) return;
  const zoomedIn = window.visualViewport.scale > 1.02;
  bookFrame.style.touchAction = zoomedIn ? 'auto' : 'pan-y pinch-zoom';
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', updateZoomState);
  window.visualViewport.addEventListener('scroll', updateZoomState);
}

applyCapability();
goToPage(1);
</script>
</body>
</html>
